<main class="cliente-page">
  <header class="cliente-header">
    <div>
      <h1>Adicionar Cliente</h1>
      <p>Preencha as informações para cadastrar um novo cliente.</p>
    </div>

  </header>

  <section class="form-card" aria-labelledby="adicionar-cliente">
    <form class="cliente-form" #clienteForm="ngForm" (ngSubmit)="salvar()" novalidate>
      <div class="form-group">
        <label for="nome">Nome</label>
        <input id="nome" type="text" name="nome" placeholder="Nome do cliente" aria-label="Nome" autocomplete="name" [(ngModel)]="cliente.nome" maxlength="40" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" placeholder="seu@email.com" aria-label="Email" autocomplete="email" [(ngModel)]="cliente.email" maxlength="100" required email>
      </div>

      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input id="telefone" type="tel" name="telefone" placeholder="(00) 00000-0000" aria-label="Telefone" autocomplete="tel" inputmode="numeric" mask="(00) 0000-0000||(00) 00000-0000" [(ngModel)]="cliente.telefone" required>
      </div>

      <div class="form-group">
        <label for="endereco">Endereço</label>
        <textarea id="endereco" name="endereco" placeholder="Rua, número, bairro e complemento" aria-label="Endereço" autocomplete="street-address" [(ngModel)]="cliente.endereco" maxlength="300" required></textarea>
      </div>

      @if (errorMessage()) {
        <p class="error-message" role="alert">{{ errorMessage() }}</p>
      }

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="clienteForm.invalid || isSaving()">
          {{ isSaving() ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </section>
</main>
