<div class="app">
  <main class="screen">
    <header class="screen__header">
      <h1 class="screen__title" id="clientes">Clientes</h1>

      <form class="obra-search" role="search">
        <label class="obra-search__row">
          <span class="obra-search__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
              <path
                d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"
              ></path>
            </svg>
          </span>
          <input
            class="obra-search__input"
            type="search"
            placeholder="Pesquisar cliente…"
            aria-label="Pesquisar cliente"
            (input)="filtrarClientes($event)"
          />
        </label>
      </form>
      <button class="button screen__add" type="button" routerLink="/menu/clienteForm">
        + Adicionar cliente
      </button>
    </header>

    <section class="clients" aria-labelledby="clientes">
      <div class="clients__scroll" tabindex="0" role="region" aria-label="Tabela de clientes">
        @if (errorMessage()) {
          <p class="clients__message" role="status">{{ errorMessage() }}</p>
        }

        <table
          mat-table
          [dataSource]="dataSource"
          class="clients__table"
          aria-label="Lista de clientes"
        >
          <ng-container matColumnDef="nome">
            <th mat-header-cell *matHeaderCellDef>Nome</th>
            <td mat-cell *matCellDef="let cliente">{{ cliente.nome }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let cliente">{{ cliente.email }}</td>
          </ng-container>

          <ng-container matColumnDef="telefone">
            <th mat-header-cell *matHeaderCellDef>Telefone</th>
            <td mat-cell *matCellDef="let cliente">{{ cliente.telefone }}</td>
          </ng-container>

          <ng-container matColumnDef="endereco">
            <th mat-header-cell *matHeaderCellDef>Endereço</th>
            <td mat-cell *matCellDef="let cliente">{{ cliente.endereco }}</td>
          </ng-container>

          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef>Ações</th>
            <td mat-cell *matCellDef="let cliente">
              <div class="clients__actions">
                <button
                  class="table__edit"
                  type="button"
                  [routerLink]="['/menu/clienteItem', cliente.id]"
                  [attr.aria-label]="'Editar ' + cliente.nome"
                >
                  Editar
                </button>
                <button
                  class="table__delete"
                  type="button"
                  (click)="confirmarExclusao(cliente)"
                  [attr.aria-label]="'Deletar ' + cliente.nome"
                >
                  Deletar
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let cliente; columns: displayedColumns"></tr>
          <tr class="mat-mdc-row" *matNoDataRow>
            <td class="mat-mdc-cell clients__empty" [attr.colspan]="displayedColumns.length">
              {{
                dataSource.filter
                  ? 'Nenhum cliente encontrado.'
                  : errorMessage() || 'Nenhum cliente cadastrado.'
              }}
            </td>
          </tr>
        </table>
      </div>
    </section>
  </main>
</div>
