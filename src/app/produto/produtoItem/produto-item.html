<main class="produto-page">
  <header class="produto-header">
    <h1>Editar Produto</h1>
  </header>

  @if (isLoading) {
    <p>Carregando produto...</p>
  } @else if (!produto) {
    <p class="error-message">{{ errorMessage }}</p>

    <button type="button" class="btn-cancel" (click)="cancelar()">Voltar</button>
  } @else {
    <section class="form-card">
      <form #produtoForm="ngForm" (ngSubmit)="salvar()">
        <div class="form-group">
          <label for="nome">Nome</label>

          <input id="nome" name="nome" type="text" [(ngModel)]="produto.nome" required />
        </div>

        <div class="form-group">
          <label for="categoria">Categoria</label>

          <select id="categoria" name="categoria" [(ngModel)]="produto.categoria" required>
            <option value="Bolos">Bolos</option>
            <option value="Docinhos">Docinhos</option>
            <option value="Pães">Pães</option>
            <option value="Salgados">Salgados</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="form-group">
          <label for="imagem">Alterar imagem</label>

          <input
            id="imagem"
            name="imagem"
            type="file"
            accept="image/*"
            (change)="selecionarImagem($event)"
          />

          @if (produto.imagem) {
            <img class="preview" [src]="produto.imagem" [alt]="produto.nome" />
          }
        </div>

        <div class="form-group">
          <label for="preco">Preço (R$)</label>

          <input
            id="preco"
            name="preco"
            type="number"
            min="0.01"
            step="0.01"
            [(ngModel)]="produto.preco"
            required
          />
        </div>

        @if (errorMessage) {
          <p class="error-message" role="alert">{{ errorMessage }}</p>
        }

        <div class="form-actions">
          <button type="button" class="btn-cancel" (click)="cancelar()">Cancelar</button>

          <button type="submit" class="btn-save" [disabled]="produtoForm.invalid || isSaving">
            {{ isSaving ? 'Salvando...' : 'Salvar alterações' }}
          </button>
        </div>
      </form>
    </section>
  }
</main>
