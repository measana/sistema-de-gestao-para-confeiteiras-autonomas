<div class="menu-shell">
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <polyline points="9 22 9 12 15 12 15 22" />
    </symbol>
    <symbol id="i-box" viewBox="0 0 24 24">
      <path
        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
      />
      <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
      <line x1="12" y1="22.08" x2="12" y2="12" />
    </symbol>
    <symbol id="i-file-text" viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
      <polyline points="14 2 14 8 20 8" />
      <line x1="16" y1="13" x2="8" y2="13" />
      <line x1="16" y1="17" x2="8" y2="17" />
      <polyline points="10 9 9 9 8 9" />
    </symbol>
    <symbol id="i-layers" viewBox="0 0 24 24">
      <polygon points="12 2 2 7 12 12 22 7 12 2" />
      <polyline points="2 17 12 22 22 17" />
      <polyline points="2 12 12 17 22 12" />
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" />
      <path
        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
      />
    </symbol>
    <symbol id="i-more" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="1" />
      <circle cx="12" cy="5" r="1" />
      <circle cx="12" cy="19" r="1" />
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24">
      <line x1="21" y1="10" x2="3" y2="10" />
      <line x1="21" y1="6" x2="3" y2="6" />
      <line x1="21" y1="14" x2="3" y2="14" />
      <line x1="21" y1="18" x2="3" y2="18" />
    </symbol>
  </svg>

  <aside class="sidebar" [class.sidebar--open]="menuOpen()">
    <header class="sidebar__header">
      <div class="sidebar__brand">
        <img
          class="sidebar__logo"
          src="assets/logo.png"
          alt="Logotipo da marca"
        />
        <p class="sidebar__title">Pettitgato</p>
      </div>
      <button
        class="sidebar__toggle"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="sidebar-panel"
        [attr.aria-label]="menuOpen() ? 'Recolher menu de navegação' : 'Expandir menu de navegação'"
        (click)="toggleMenu()"
      >
        <svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg>
      </button>
    </header>

    <div class="sidebar__panel" id="sidebar-panel" [class.is-open]="menuOpen()">
      <nav class="sidebar__group" aria-label="Navegação principal">
        <ul class="nav">
          <li class="nav__item">
            <a
              class="nav__link"
              routerLink="/menu/dashboard"
              routerLinkActive="nav__link--active"
              ariaCurrentWhenActive="page"
            >
              <span class="nav__icon"
                ><svg class="icon" aria-hidden="true"><use href="#i-home" /></svg
              ></span>
              <span class="nav__label">Dashboard</span>
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              routerLink="/menu/pedidoList"
              routerLinkActive="nav__link--active"
              ariaCurrentWhenActive="page"
            >
              <span class="nav__icon"
                ><svg class="icon" aria-hidden="true"><use href="#i-box" /></svg
              ></span>
              <span class="nav__label">Pedidos</span>
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              routerLink="/menu/clienteList"
              routerLinkActive="nav__link--active"
              ariaCurrentWhenActive="page"
            >
              <span class="nav__icon"
                ><svg class="icon" aria-hidden="true"><use href="#i-file-text" /></svg
              ></span>
              <span class="nav__label">Clientes</span>
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              routerLink="/menu/produtoList"
              routerLinkActive="nav__link--active"
              ariaCurrentWhenActive="page"
            >
              <span class="nav__icon"
                ><svg class="icon" aria-hidden="true"><use href="#i-layers" /></svg
              ></span>
              <span class="nav__label">Produtos</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar__footer">
        <nav class="sidebar__group" aria-label="Configurações da conta">
          <ul class="nav">
            <li class="nav__item">
              <a class="nav__link" href="#settings">
                <span class="nav__icon"
                  ><svg class="icon" aria-hidden="true"><use href="#i-settings" /></svg
                ></span>
                <span class="nav__label">Configurações</span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="profile-widget">
          <div class="profile-widget__info">
            <div class="profile-widget__avatar">
              <img
                src="https://www.figma.com/api/mcp/asset/98092589-64f8-4866-b860-eccfe83ec185/17be4.png"
                [alt]="'Foto de perfil de ' + nomeUsuario"
              />
            </div>
            <div class="profile-widget__text">
              <p class="profile-widget__name">{{ nomeUsuario }}</p>
              <p class="profile-widget__email">Conta conectada</p>
            </div>
          </div>
          <span class="profile-widget__more"
            ><svg class="icon" aria-hidden="true"><use href="#i-more" /></svg
          ></span>
        </div>
      </div>
    </div>
  </aside>

  <div class="menu-content">
    <router-outlet />
  </div>
</div>
